<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Reader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>The Book</h1>
      <ul id="chapter-list"></ul>
    </aside>

    <main id="content">
      <header id="chapter-header">
        <h2 id="chapter-title">Select a chapter</h2>
      </header>
      <article id="chapter-body">
        <p>Choose a chapter from the left to begin reading.</p>
      </article>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
